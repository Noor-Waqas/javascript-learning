<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexical Scoping Closure</title>
<link rel="stylesheet" href="./index.css">
</head>
<body>
    <h1 style="text-align: center;">Lexical Scoping Closure Real Example </h1>
    <div style="display: flex; justify-content: center;">
        <div>
            <button id="orange">Orange</button>
            <button id="green">Green</button>
            <button id="red">Red</button>
            <button id="yellow">Yellow</button>
        </div>
    </div>
    <script>

        function clickHandelar (color){

           return function(){ // return function with laxical scope 
            document.body.style.backgroundColor = `${color}`   
            }
        }

        document.getElementById("orange").onclick = clickHandelar("orange")
        document.getElementById("green").onclick = clickHandelar("green")
        document.getElementById("red").onclick = clickHandelar("red")
        document.getElementById("yellow").onclick = clickHandelar("yellow")
    </script>
</body>
</html>
