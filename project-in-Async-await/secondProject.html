<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./index.css">
    <title>Async Await</title>
</head>
<body>
    <h1 style="text-align: center; margin-top: 3rem;">Secont Projects</h1>
   <div style="display: flex; justify-content: center; align-items: center;gap: 10px;">
       <button id="start" class="buttonStyles">Start</button>
       <button id="stop" class="buttonStyles">Stop</button>

   </div>
   <script>
    const sayDate = ()=>{
        console.log("Waqas Ahmad",Date.now().toLocaleString());
    }
    let intervalId = null;

    // const intervalId =  setInterval(sayDate,2000)

    document.querySelector("#start").addEventListener("click",()=>{
        if (!intervalId) { // prevent multiple intervals
            intervalId = setInterval(sayDate, 2000);
            console.log("Start Now.............");
        }
    })

    

    document.querySelector("#stop").addEventListener("click",()=>{
        clearInterval(intervalId)//start now 
        intervalId = null; // reset
        console.log("Stop Now.............")
    })
    
   </script>

 
</body>
</html>
